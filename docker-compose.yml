services:
  postgres:
    image: postgres:16-alpine
    container_name: jungle-wagering-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-jungle}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-jungle_secret}
      POSTGRES_DB: ${DB_NAME:-wagering_processor}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-jungle} -d ${DB_NAME:-wagering_processor}"]
      interval: 5s
      timeout: 5s
      retries: 10

  ministack:
    image: nahuelnucera/ministack:latest
    container_name: jungle-wagering-ministack
    restart: unless-stopped
    ports:
      - "4566:4566"

  ministack-init:
    image: amazon/aws-cli:2.17.0
    container_name: jungle-wagering-ministack-init
    depends_on:
      - ministack
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      SQS_ENDPOINT: http://ministack:4566
      SQS_WAGER_TRANSACTIONS_QUEUE_NAME: ${SQS_WAGER_TRANSACTIONS_QUEUE_NAME:-wager-transactions.fifo}
      SQS_WAGER_TRANSACTIONS_DLQ_NAME: ${SQS_WAGER_TRANSACTIONS_DLQ_NAME:-wager-transactions-dlq.fifo}
    volumes:
      - ./infra/ministack/init-sqs.sh:/init-sqs.sh:ro
    entrypoint: ["/bin/sh", "/init-sqs.sh"]

volumes:
  postgres_data:

